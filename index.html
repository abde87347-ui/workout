<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل التمارين الرياضية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#EDF0F2;--surface:#fff;--ink:#1B1F24;--muted:#5B6570;--accent:#D93E0A;--on-accent:#fff;--line:#D5DBE0;--soft:#F5F7F8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181C;--surface:#1E2227;--ink:#ECEFF2;--muted:#9AA5B1;--accent:#FF6A33;--on-accent:#15181C;--line:#323941;--soft:#262B31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181C;--surface:#1E2227;--ink:#ECEFF2;--muted:#9AA5B1;--accent:#FF6A33;--on-accent:#15181C;--line:#323941;--soft:#262B31;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;font-size:17px;line-height:1.75}
main{max-width:720px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:2rem;font-weight:800;margin:0 0 6px;line-height:1.3}
.lead{color:var(--muted);margin:0 0 28px}
h2{font-size:1.05rem;font-weight:700;margin:26px 0 10px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{flex:1 1 140px;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-weight:700;text-align:center}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.scheme{margin:22px 0 4px;padding:14px 16px;background:var(--ink);color:var(--bg);border-radius:10px;font-weight:500}
.scheme b{font-weight:800}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:16px;padding:20px}
.card h3{margin:0 0 2px;font-size:1.3rem;font-weight:800;line-height:1.4}
.count{color:var(--muted);font-size:.9rem}
dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
dt{font-weight:700}dd{margin:0}
.card h4{margin:18px 0 6px;font-size:1rem;font-weight:700}
ol,ul{margin:0;padding-inline-start:1.4rem}
li{margin:3px 0}
ol li::marker{font-weight:800;color:var(--accent)}
.warn{background:var(--soft);border-radius:8px;padding:10px 14px 10px 10px;margin-top:18px}
.warn h4{margin-top:0}
.breath{margin:16px 0 0;color:var(--muted);font-size:.95rem}
.hint{padding:28px 0;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>دليل التمارين الرياضية</h1>
<p class="lead">اختر مستواك ثم العضلة التي تريد تدريبها، وستظهر لك التمارين مع شرح مفصل لكل تمرين.</p>
<h2>المستوى</h2>
<div class="row" id="levels"></div>
<h2>العضلة</h2>
<div class="row" id="muscles"></div>
<div id="out"><p class="hint">اختر المستوى والعضلة لعرض التمارين.</p></div>
</main>
<script>

","target":"الصدر (عزل كامل للعضلة)","steps":["اضبط البكرتين على مستوى الكتفين وامسك المقبضين","قف في المنتصف مع ميلان بسيط للأمام وقدم أمام الأخرى","اسحب الكابلين في حركة قوسية حتى يلتقي المقبضان أمام الصدر","ارجع ببطء مع الإحساس بتمدد الصدر"],"tips":["احتفظ بانحناء بسيط ثابت في المرفقين","استخدم وزناً خفيفاً وركّز على الإحساس بالعضلة"],"mistakes":["ثني وفرد المرفقين (يتحول إلى ضغط)","التأرجح بالجذع لسحب وزن أكبر"]},{"id":"barbell_bench","min_level":2,"title":"ضغط البار على البنش","equipment":"بار + بنش مسطح + رف أمان","target":"الصدر (أساسي) • الترايسبس والكتف الأمامي (مساند)","steps":["استلقِ بحيث تكون عيناك تحت البار وثبّت قدميك على الأرض","امسك البار بعرض أوسع من الكتفين وأخرجه من الرف","انزل به بتحكم إلى منتصف الصدر","ادفعه بقوة للأعلى حتى فرد الذراعين"],"tips":["اضغط لوحي الكتف معاً وللأسفل","استعن دائماً بمساعد أو رف أمان"],"mistakes":["ارتداد البار عن الصدر","رفع الأرداف عن البنش"]},{"id":"dips","min_level":2,"title":"تمرين المتوازي (Dips)","equipment":"جهاز المتوازي","target":"أسفل الصدر والترايسبس (أساسي) • الكتف الأمامي (مساند)","steps":["أمسك المتوازي وارفع جسمك مع فرد الذراعين","مِل بالجذع للأمام قليلاً لتركيز الجهد على الصدر","انزل ببطء حتى يصبح الكتف بمستوى المرفق تقريباً","ادفع جسمك للأعلى حتى فرد الذراعين"],"tips":["اثنِ الركبتين وتقاطع الكاحلين للثبات","أضف وزناً إضافياً فقط عند إتقان الأداء"],"mistakes":["النزول أكثر من اللازم مما يجهد الكتف","تحريك الجسم بالتأرجح"]}]},"back":{"name":"🦍 الظهر","exercises":[{"id":"lat_pulldown","min_level":0,"title":"السحب للأسفل (Lat Pulldown)","equipment":"جهاز السحب العلوي","target":"الظهر العريض (اللاتس) • البايسبس (مساند)","steps":["اجلس وثبّت فخذيك تحت الوسادة","امسك البار بعرض أوسع من الكتفين","اسحب البار إلى أعلى الصدر مع ضم لوحي الكتف","ارجع ببطء حتى فرد الذراعين دون تأرجح"],"tips":["تخيّل أنك تسحب بمرفقيك لا بيديك","أبقِ صدرك مرفوعاً وظهرك مقوساً قليلاً"],"mistakes":["الميل الكبير للخلف لسحب وزن أثقل","السحب خلف الرقبة"]},{"id":"seated_row","min_level":0,"title":"سحب الكابل الجالس (Seated Row)","equipmen  (Leg Raises)","equipment":"سجادة تمرين","target":"أسفل البطن • عضلات الورك","steps":["استلقِ على الظهر وضع يديك تحت الأرداف","ارفع الرجلين مستقيمتين حتى زاوية 90 درجة","انزل ببطء دون لمس الأرض ثم كرر"],"tips":["ألصق أسفل الظهر بالأرض طوال الحركة","اثنِ الركبتين قليلاً إن كان صعباً"],"mistakes":["تقويس أسفل الظهر","إنزال الرجلين بسرعة"]},{"id":"ab_wheel","min_level":2,"title":"عجلة البطن (Ab Wheel)","equipment":"عجلة البطن","target":"البطن بالكامل • الكتفين • أسفل الظهر","steps":["اركع على سجادة وامسك العجلة أمامك","تدحرج للأمام بأقصى مدى تتحمله مع شد البطن","اسحب العجلة للخلف بتقلص البطن"],"tips":["ابدأ بمدى قصير وزِده تدريجياً","حافظ على استقامة الظهر وحوض مائل قليلاً للخلف"],"mistakes":["تقويس الظهر وهبوط الورك","الاندفاع للأمام بشكل أكبر من قدرتك"]}]}}};
const LEVELS=D.LEVELS,MUSCLES=D.MUSCLES;
let level=null,muscle=null;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const $=id=>document.getElementById(id);
function pills(box,items,cur,onPick){
  box.innerHTML="";
  items.forEach(([k,name])=>{
    const b=document.createElement("button");
    b.className="opt";b.type="button";b.textContent=name;
    b.setAttribute("aria-pressed",k===cur);
    b.onclick=()=>onPick(k);
    box.appendChild(b);
  });
}
function render(){
  pills($("levels"),Object.entries(LEVELS).map(([k,v])=>[k,v.name]),level,k=>{level=k;render()});
  pills($("muscles"),Object.entries(MUSCLES).map(([k,v])=>[k,v.name]),muscle,k=>{muscle=k;render()});
  const out=$("out");
  if(!level||!muscle){out.innerHTML='<p class="hint">'+(level?"اختر العضلة لعرض التمارين.":"اختر المستوى والعضلة لعرض التمارين.")+'</p>';return}
  const L=LEVELS[level],M=MUSCLES[muscle];
  const list=M.exercises.filter(e=>e.min_level<=L.rank);
  let h='<div class="scheme"><b>النظام المقترح:</b> '+esc(L.scheme)+'</div>';
  list.forEach((e,i)=>{
    h+='<article class="card"><span class="count">التمرين '+(i+1)+' من '+list.length+'</span><h3>'+esc(e.title)+'</h3>'
     +'<dl><dt>العضلات المستهدفة</dt><dd>'+esc(e.target)+'</dd><dt>الأدوات</dt><dd>'+esc(e.equipment)+'</dd></dl>'
     +'<h4>طريقة الأداء</h4><ol>'+e.steps.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ol>'
     +'<h4>نصائح</h4><ul>'+e.tips.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ul>'
     +'<div class="warn"><h4>أخطاء شائعة</h4><ul>'+e.mistakes.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ul></div>'
     +(e.hold?"":'<p class="breath"><b>التنفس:</b> ازفر أثناء الجهد، واشهق أثناء الرجوع.</p>')
     +'</article>';
  });
  h+='<p class="hint">سخّن جيداً قبل البدء ولا تهمل الإطالة بعد التمرين.</p>';
  out.innerHTML=h;
}
render();
</script>
